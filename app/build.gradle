plugins { id 'com.android.application' }

android {
    namespace 'com.zhiyi.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zhiyi.memory.personal'
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName '2.6'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('RC_STORE_FILE')) {
                storeFile file(System.getenv('RC_STORE_FILE'))
                storePassword System.getenv('RC_STORE_PASSWORD')
                keyAlias System.getenv('RC_KEY_ALIAS')
                keyPassword System.getenv('RC_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('RC_STORE_FILE')) signingConfig signingConfigs.release
        }
    }
}
